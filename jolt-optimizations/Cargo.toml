[package]
name = "jolt-optimizations"
version = "0.1.0"
edition = "2021"
authors = ["arkworks contributors"]
description = "Optimized BN254 G2 scalar multiplication using 4D GLV decomposition"
license = "MIT/Apache-2.0"

[dependencies]
# Use published arkworks versions for stability

ark-bn254 = "0.5.0"
ark-ec = { version = "0.5.0", default-features = false, features = [
    "parallel",
] }
ark-ff = { version = "0.5.0", default-features = false, features = [
    "parallel",
] }
ark-serialize = { version = "0.5.0", default-features = false, features = [
    "derive",
    "parallel",
] }
ark-std = "0.4"
num-bigint = "0.4"
num-rational = "0.4.2"
num-integer = "0.1.46"
num-traits = "0.2"
rayon = "1.8"

# Patches should be in workspace root Cargo.toml

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "scalar_multiplication"
harness = false

[[bench]]
name = "dory_utils"
harness = false

[[bench]]
name = "dory_all"
harness = false

[[bench]]
name = "g1_scalar_multiplication"
harness = false

[[bench]]
name = "vector_scalar_mul_add_gamma_g2"
harness = false